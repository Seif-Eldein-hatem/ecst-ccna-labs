<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>ECST · CCNA Challenge Labs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#fff;--bd:#e6e6e6;--soft:#f4f4f4;--red:#a91818;--redsoft:#fbeaea;--ok:#1b7f3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0e;--fg:#f2f2f2;--mut:#9a9a9a;--card:#161616;--bd:#2a2a2a;--soft:#222;--red:#e0464a;--redsoft:#2a1516;--ok:#4cc16b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}
header{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header img{height:38px;border-radius:6px}header nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav a,.btn{padding:8px 16px;border-radius:999px;color:var(--mut);text-decoration:none;font-weight:500;cursor:pointer;border:0;background:none;font:inherit}
nav a.on{background:var(--soft);color:var(--fg)}
.btn{background:var(--red);color:#fff;border-radius:10px;font-weight:600}.btn.g{background:var(--soft);color:var(--fg)}.btn.s{padding:5px 10px;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:40px 20px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:28px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px}
.big{font:700 34px 'Space Grotesk';margin-top:6px}.big small{font:400 13px 'JetBrains Mono';color:var(--mut)}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--red)}
.room{display:flex;gap:18px;margin-bottom:16px;cursor:pointer;align-items:flex-start}.room.lock{opacity:.6;cursor:default}
.num{min-width:54px;height:54px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font:500 16px 'JetBrains Mono'}
.room.cur{border-color:var(--red)}.room.cur .num{border:1px solid var(--red)}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font:500 11px 'JetBrains Mono';letter-spacing:.1em;background:var(--soft);text-transform:uppercase}
.tag.Medium,.tag.Hard{background:var(--redsoft);color:var(--red)}.tag.Expert{background:var(--red);color:#fff}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;margin:6px 0 14px}
input:focus,textarea:focus{outline:0;border-color:var(--red)}
.auth{max-width:420px;margin:60px auto;text-align:center}.auth .card{text-align:left;margin-top:24px}
.q{border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px}.q.done{border-color:var(--ok)}
.row{display:flex;gap:10px;align-items:center}.row input{margin:10px 0 0}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--bd)}th{font:500 11px 'JetBrains Mono';color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:9}
.scroll{overflow-x:auto}
</style></head><body><div id="app"></div>

const SEED=[{"title": "Network Foundations", "cat": "Fundamentals", "diff": "Easy", "min": 15, "desc": "Map any packet onto the right OSI layer and name the device that moves it.", "qs": [{"q": "Which OSI layer does a router operate at? (number)", "a": "3;layer 3;network"}, {"q": "Which OSI layer handles framing and MAC addressing? (number)", "a": "2;layer 2;data link"}, {"q": "What is the PDU name at Layer 4 for TCP?", "a": "segment"}, {"q": "Which device forwards frames based on MAC addresses?", "a": "switch"}, {"q": "Which OSI layer is called Presentation? (number)", "a": "6;layer 6"}]}, {"title": "Cabling & Ethernet", "cat": "Fundamentals", "diff": "Easy", "min": 15, "desc": "Cable lengths, connectors and standards - the physical layer facts every CCNA exam expects.", "qs": [{"q": "Max length in metres of a UTP Ethernet segment?", "a": "100"}, {"q": "Which cable type connects two switches on legacy gear: straight-through or crossover?", "a": "crossover"}, {"q": "Which connector does UTP Ethernet use?", "a": "rj45;rj-45"}, {"q": "IEEE standard for Gigabit Ethernet over copper?", "a": "802.3ab"}]}, {"title": "Network Devices & Topologies", "cat": "Fundamentals", "diff": "Easy", "min": 15, "desc": "Routers, switches, firewalls and the wireless LAN types they connect.", "qs": [{"q": "Which table does a router consult to forward a packet?", "a": "routing table"}, {"q": "A switch stores learned MAC addresses in which table?", "a": "cam;cam table;mac table;mac address table"}, {"q": "Which firewall type tracks the state of connections?", "a": "stateful"}, {"q": "Which WLAN type needs no access point, clients talk directly?", "a": "ad hoc;adhoc;ibss"}]}, {"title": "TCP, UDP & Transport", "cat": "Fundamentals", "diff": "Easy", "min": 15, "desc": "How the transport layer sets up, numbers and delivers data.", "qs": [{"q": "Which message completes the TCP three-way handshake?", "a": "ack"}, {"q": "Which transport protocol is connectionless?", "a": "udp"}, {"q": "Default TCP port of HTTPS?", "a": "443"}, {"q": "Which transport protocol uses sequence numbers to guarantee order?", "a": "tcp"}]}, {"title": "Discovery Protocols & PoE", "cat": "Fundamentals", "diff": "Easy", "min": 15, "desc": "CDP, LLDP and powering devices over the cable.", "qs": [{"q": "Command that lists CDP neighbors?", "a": "show cdp neighbors"}, {"q": "Which discovery protocol is vendor-neutral (IEEE 802.1AB)?", "a": "lldp"}, {"q": "In PoE, the device that supplies power is the ___ (3-letter abbreviation)?", "a": "pse"}, {"q": "An IP phone drawing power over Ethernet is a ___ (2-letter abbreviation)?", "a": "pd"}]}, {"title": "Switching & ARP", "cat": "Switching", "diff": "Medium", "min": 20, "desc": "Follow a frame host to host: MAC learning, ARP resolution, flooding and loop prevention.", "qs": [{"q": "What does a switch do with a frame to an unknown unicast MAC?", "a": "flood;flooding"}, {"q": "Which protocol maps an IP address to a MAC address?", "a": "arp"}, {"q": "Destination MAC of an ARP request?", "a": "ff:ff:ff:ff:ff:ff"}, {"q": "Which protocol prevents Layer 2 loops?", "a": "stp;spanning tree"}]}, {"title": "IPv4 Addressing & Subnetting", "cat": "Addressing", "diff": "Medium", "min": 25, "desc": "Derive network, broadcast and usable ranges from a prefix - the core CCNA maths.", "qs": [{"q": "Dotted-decimal mask for /26?", "a": "255.255.255.192"}, {"q": "Usable hosts in a /27?", "a": "30"}, {"q": "Network address of 192.168.10.77/26?", "a": "192.168.10.64"}, {"q": "Broadcast address of 10.1.1.0/24?", "a": "10.1.1.255"}]}, {"title": "Subnetting Lab - VLSM Design", "cat": "Addressing", "diff": "Medium", "min": 25, "desc": "Carve a block into right-sized subnets without wasting addresses.", "qs": [{"q": "In VLSM, allocate the largest or smallest subnet first?", "a": "largest"}, {"q": "Prefix length needed for 50 hosts?", "a": "/26;26"}, {"q": "Typical prefix for a point-to-point link?", "a": "/30;30"}]}, {"title": "DHCP, DNS & Network Services", "cat": "Services", "diff": "Medium", "min": 20, "desc": "Addressing hosts automatically and resolving names.", "qs": [{"q": "First message a DHCP client sends?", "a": "discover;dhcpdiscover"}, {"q": "UDP port the DHCP server listens on?", "a": "67"}, {"q": "At what fraction of the lease does the client first try to renew?", "a": "1/2;half;50%"}, {"q": "Which protocol resolves hostnames to IP addresses?", "a": "dns"}]}, {"title": "VLANs & Trunking", "cat": "Switching", "diff": "Medium", "min": 20, "desc": "Segment broadcast domains and carry VLANs between switches.", "qs": [{"q": "Command to put an access port in VLAN 20?", "a": "switchport access vlan 20"}, {"q": "DTP mode that actively tries to form a trunk?", "a": "dynamic desirable;desirable"}, {"q": "Which VLAN carries untagged frames on an 802.1Q trunk?", "a": "native vlan;native"}, {"q": "What Layer 2 feature splits broadcast domains on a switch?", "a": "vlan;vlans"}]}, {"title": "Wireless Fundamentals", "cat": "Wireless", "diff": "Medium", "min": 20, "desc": "Channels, controllers and Wi-Fi security generations.", "qs": [{"q": "Non-overlapping 2.4 GHz channels in the US?", "a": "1,6,11;1 6 11"}, {"q": "Protocol a WLC uses to control lightweight APs?", "a": "capwap"}, {"q": "Bit size of the WPA3-Enterprise 192-bit suite?", "a": "192"}, {"q": "QAM level used by 802.11ax?", "a": "1024;1024-qam"}]}, {"title": "IPv6 Fundamentals", "cat": "Addressing", "diff": "Hard", "min": 25, "desc": "Address formats, shortening rules and the prefixes that matter.", "qs": [{"q": "How many bits is an IPv6 address?", "a": "128"}, {"q": "Shortest form of 2001:0db8:0000:0000:0000:0000:0000:0001?", "a": "2001:db8::1"}, {"q": "Link-local prefix?", "a": "fe80::/10;fe80::"}]}, {"title": "Routing Fundamentals", "cat": "Routing", "diff": "Hard", "min": 25, "desc": "Longest match, administrative distance and the commands that prove a route is installed.", "qs": [{"q": "Default AD of OSPF?", "a": "110"}, {"q": "Default AD of a static route?", "a": "1"}, {"q": "Command to display the routing table?", "a": "show ip route"}, {"q": "Which rule picks between overlapping routes?", "a": "longest prefix match;longest match"}]}, {"title": "Spanning Tree & EtherChannel", "cat": "Switching", "diff": "Hard", "min": 25, "desc": "Root election, rapid convergence and bundling links.", "qs": [{"q": "The root bridge has the lowest what?", "a": "bridge id;bid"}, {"q": "IEEE standard number for RSTP?", "a": "802.1w"}, {"q": "Which EtherChannel protocol is the IEEE standard?", "a": "lacp"}, {"q": "Maximum active links in one EtherChannel?", "a": "8"}]}, {"title": "OSPF & Dynamic Routing", "cat": "Routing", "diff": "Hard", "min": 25, "desc": "Neighbours, DR election and link-state basics.", "qs": [{"q": "Multicast address for OSPF hellos?", "a": "224.0.0.5"}, {"q": "Which LSA type is the Router LSA?", "a": "1;type 1;lsa 1"}, {"q": "Which algorithm does OSPF run?", "a": "dijkstra;spf"}, {"q": "DR election prefers the highest what first?", "a": "priority;ospf priority"}]}, {"title": "First Hop Redundancy", "cat": "Routing", "diff": "Hard", "min": 20, "desc": "HSRP, VRRP and GLBP keeping the default gateway alive.", "qs": [{"q": "Default HSRP priority?", "a": "100"}, {"q": "Which FHRP load-balances using multiple virtual MACs?", "a": "glbp"}, {"q": "Which FHRP is an open standard?", "a": "vrrp"}, {"q": "The HSRP router currently forwarding traffic is the ___ router?", "a": "active"}]}, {"title": "Network Management & QoS", "cat": "Services", "diff": "Hard", "min": 25, "desc": "SNMP, Syslog, NTP and traffic marking.", "qs": [{"q": "Unsolicited notification an SNMP agent sends?", "a": "trap"}, {"q": "Command to view the local syslog buffer?", "a": "show logging"}, {"q": "Highest believable NTP stratum?", "a": "15"}, {"q": "Decimal DSCP value of EF (binary 101110)?", "a": "46"}]}, {"title": "VLANs, Trunks & STP", "cat": "Switching", "diff": "Expert", "min": 30, "desc": "Trunk tagging, native VLANs, root bridge election and the commands that reveal them.", "qs": [{"q": "Trunk tagging standard?", "a": "802.1q"}, {"q": "Default native VLAN?", "a": "1"}, {"q": "Command to list trunk ports?", "a": "show interfaces trunk;show interface trunk"}, {"q": "Root bridge is elected by the lowest what?", "a": "bridge id;bid;bridge priority"}]}, {"title": "Security, ACLs & NAT", "cat": "Security", "diff": "Expert", "min": 30, "desc": "Wildcard logic, implicit denies and NAT translations at the edge of the network.", "qs": [{"q": "Wildcard mask equivalent to /24?", "a": "0.0.0.255"}, {"q": "What implicit rule ends every ACL?", "a": "deny any;implicit deny;deny"}, {"q": "NAT many-to-one using ports is called?", "a": "pat;nat overload;overload"}, {"q": "Standard numbered ACL range?", "a": "1-99"}]}, {"title": "Layer 2 Attacks & Port Security", "cat": "Security", "diff": "Expert", "min": 30, "desc": "Defend the access layer against spoofing and flooding.", "qs": [{"q": "Default port-security violation mode?", "a": "shutdown"}, {"q": "Keyword that learns MACs and saves them in the running config?", "a": "sticky"}, {"q": "Attack that fills the CAM table with spoofed MACs?", "a": "mac flooding;cam table overflow;cam overflow;mac flood"}, {"q": "Feature that blocks rogue DHCP servers?", "a": "dhcp snooping"}]}, {"title": "SDN, Automation & WAN", "cat": "Automation", "diff": "Expert", "min": 30, "desc": "Controllers, REST, configuration management and MPLS.", "qs": [{"q": "REST verb that creates a new resource?", "a": "post"}, {"q": "Ansible name for an ordered list of tasks?", "a": "playbook;playbooks"}, {"q": "Which plane forwards traffic from ingress to egress?", "a": "data plane;data;forwarding plane"}, {"q": "MPLS forwards using which inserted header?", "a": "label;shim;shim header;mpls label"}]}].map((r,i)=>({...r,id:i+1}));
let S;
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!S)S={users:[{name:'ECST Admin',email:'alhassanadmin@ecst.edu',pass:'AL_ADMIN2005',role:'admin'}],prog:{},rooms:SEED,me:null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
load();
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const done=(em,r)=>((S.prog[em]||{})[r.id]||[]);
const cleared=(em,r)=>done(em,r).length>=r.qs.length;
const pts=em=>S.rooms.reduce((n,r)=>n+done(em,r).length*10,0);
const total=()=>S.rooms.reduce((n,r)=>n+r.qs.length*10,0);
const unlocked=i=>S.me.role==='admin'||i===0||cleared(S.me.email,S.rooms[i-1]);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function header(h){const a=S.me.role==='admin';return `<header><img src="${LOGO}" alt="ECST"><span class="mono">CCNA Challenge Labs</span><nav>
<a href="#path" class="${h=='path'||h.startsWith('room')?'on':''}">Path</a><a href="#board" class="${h=='board'?'on':''}">Leaderboard</a>${a?`<a href="#admin" class="${h=='admin'?'on':''}">Admin</a>`:''}
<span style="text-align:right;margin-left:10px"><div style="font-weight:500">${e(S.me.name)}</div><div class="mono" style="font-size:10px">${a?'Supervisor':'Student'}</div></span><a onclick="out()">Log out</a></nav></header>`}
function out(){S.me=null;save();draw()}
let mode='login';
function auth(){return `<div class="auth"><img src="${LOGO}" style="height:80px;border-radius:14px"><h1 style="margin-top:18px">${mode=='login'?'Welcome back':'Create account'}</h1>
<p style="color:var(--mut)">ECST · CCNA Challenge Labs</p><div class="card">
${mode=='reg'?'<label>Full name</label><input id="n" placeholder="Your name">':''}<label>Email</label><input id="em" placeholder="you@example.com"><label>Password</label><input id="pw" type="password" placeholder="••••••••">
<button class="btn" style="width:100%;padding:13px" onclick="${mode=='login'?'login()':'reg()'}">${mode=='login'?'Log in':'Sign up'}</button></div>
<p style="color:var(--mut)">${mode=='login'?"Don't have an account? <a style='color:var(--red);cursor:pointer' onclick=\"mode='reg';draw()\">Create one</a>":"Have an account? <a style='color:var(--red);cursor:pointer' onclick=\"mode='login';draw()\">Log in</a>"}</p>
</div>`}
function login(){const u=S.users.find(x=>x.email==$('em').value.trim().toLowerCase()&&x.pass==$('pw').value);if(!u)return toast('Wrong email or password');S.me=u;save();location.hash='path';draw()}
function reg(){const em=$('em').value.trim().toLowerCase(),n=$('n').value.trim(),pw=$('pw').value;if(!n||!em.includes('@')||pw.length<6)return toast('Fill all fields (password 6+ chars)');if(S.users.some(x=>x.email==em))return toast('Email already used');const u={name:n,email:em,pass:pw,role:'student'};S.users.push(u);S.me=u;save();location.hash='path';draw()}
function path(){const em=S.me.email,c=S.rooms.filter(r=>cleared(em,r)).length,p=pts(em),t=total(),tasks=S.rooms.reduce((n,r)=>n+done(em,r).length,0),nt=S.rooms.reduce((n,r)=>n+r.qs.length,0);
let cur=S.rooms.findIndex((r,i)=>unlocked(i)&&!cleared(em,r));
return `<main><div class="mono" style="color:var(--red)">ECST · CCNA Challenge Track</div><h1 style="font-size:48px;margin:10px 0">Welcome back, ${e(S.me.name.split(' ')[0])}.</h1>
<p style="color:var(--mut);max-width:560px">Every room is a set of hands-on networking problems, graded the moment you answer. Clear a room to unlock the next one - the difficulty climbs with you.</p>
<div class="grid"><div class="card"><div class="mono">Points earned</div><div class="big">${p} <small>of ${t}</small></div></div><div class="card"><div class="mono">Rooms cleared</div><div class="big">${c} <small>of ${S.rooms.length}</small></div></div><div class="card"><div class="mono">Tasks solved</div><div class="big">${tasks} <small>of ${nt}</small></div></div></div>
<div class="card" style="margin-bottom:24px"><div class="mono" style="display:flex;justify-content:space-between">Track progress<span style="color:var(--red)">${nt?Math.round(tasks/nt*100):0}%</span></div><div class="bar"><i style="width:${nt?tasks/nt*100:0}%"></i></div></div>
${S.rooms.map((r,i)=>{const ok=unlocked(i),d=done(em,r).length;return `<div class="card room ${ok?'':'lock'} ${i==cur?'cur':''}" ${ok?`onclick="location.hash='room-${r.id}'"`:''}><div class="num">${ok?String(i+1).padStart(2,'0'):'🔒'}</div><div style="flex:1"><div class="mono">${e(r.cat)} · <span class="tag ${r.diff}">${r.diff}</span> · ${r.min} min</div><h3 style="font-size:20px;margin:6px 0 2px">${e(r.title)}</h3><div style="color:var(--mut)">${e(r.desc)}</div>
${ok?`<div class="bar"><i style="width:${d/r.qs.length*100}%"></i></div>`:`<div class="mono" style="margin-top:10px;text-transform:none">Locked — clear “${e(S.rooms[i-1].title)}” first</div>`}</div><div class="mono" style="white-space:nowrap">${r.qs.length*10} pts${ok?` · ${d}/${r.qs.length}`:''}</div></div>`}).join('')}</main>`}
function room(id){const i=S.rooms.findIndex(r=>r.id==id);if(i<0||!unlocked(i)){location.hash='path';return''}const r=S.rooms[i],em=S.me.email,dn=done(em,r);
return `<main><a href="#path" class="mono" style="color:var(--red);text-decoration:none">← Back to path</a><div class="mono" style="margin-top:20px">Room ${String(i+1).padStart(2,'0')} · ${e(r.cat)} · <span class="tag ${r.diff}">${r.diff}</span></div><h1 style="font-size:40px;margin:8px 0">${e(r.title)}</h1><p style="color:var(--mut)">${e(r.desc)}</p>
<div class="bar" style="margin-bottom:24px"><i style="width:${dn.length/r.qs.length*100}%"></i></div>
${r.qs.map((q,k)=>`<div class="q ${dn.includes(k)?'done':''}"><div class="mono">Task ${k+1} · 10 pts</div><div style="margin-top:6px;font-weight:500">${e(q.q)}</div>${dn.includes(k)?'<div style="color:var(--ok);margin-top:8px">✓ Correct</div>':`<div class="row"><input id="a${k}" placeholder="Your answer" onkeydown="if(event.key=='Enter')ans(${i},${k})"><button class="btn" style="margin-top:10px" onclick="ans(${i},${k})">Submit</button></div>`}</div>`).join('')}
${cleared(em,r)?`<div class="card" style="border-color:var(--ok);text-align:center"><h3>Room cleared 🎉</h3>${S.rooms[i+1]?`<p><a class="btn" style="display:inline-block;text-decoration:none" href="#room-${S.rooms[i+1].id}">Next room →</a></p>`:'<p>You finished the track!</p>'}</div>`:''}</main>`}
const NM=s=>s.toLowerCase().replace(/\s*,\s*/g,',').replace(/\s+/g,' ').trim();
function ans(i,k){const r=S.rooms[i],v=NM($('a'+k).value);if(!v)return;const ok=r.qs[k].a.split(';').map(NM).includes(v);
if(!ok)return toast('Incorrect — try again');const p=S.prog[S.me.email]=S.prog[S.me.email]||{};p[r.id]=[...new Set([...(p[r.id]||[]),k])];save();toast('Correct! +10');draw()}
function board(){const L=S.users.filter(u=>u.role=='student').map(u=>({u,p:pts(u.email),c:S.rooms.filter(r=>cleared(u.email,r)).length})).sort((a,b)=>b.p-a.p);
return `<main><h1>Leaderboard</h1><div class="card scroll" style="margin-top:24px"><table><tr><th>#</th><th>Student</th><th>Rooms</th><th>Points</th></tr>${L.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.u.name)}</td><td>${x.c}</td><td><b>${x.p}</b></td></tr>`).join('')||'<tr><td colspan=4>No students yet.</td></tr>'}</table></div></main>`}
let edit=null;
function admin(){if(S.me.role!='admin'){location.hash='path';return''}
const st=S.users.filter(u=>u.role=='student');
let h=`<main><h1>Admin</h1><p style="color:var(--mut)">Review results and manage rooms.</p><h3 style="margin:28px 0 12px">Rooms (${S.rooms.length})</h3><button class="btn" onclick="edt(-1)">+ New room</button>`;
if(edit!==null){const r=edit>=0?S.rooms[edit]:{title:'',cat:'',diff:'Easy',min:15,desc:'',qs:[]};
h+=`<div class="card" style="margin-top:16px"><label>Title</label><input id="et" value="${e(r.title)}"><label>Category</label><input id="ec" value="${e(r.cat)}"><label>Difficulty</label><select id="ed">${D.map(d=>`<option ${d==r.diff?'selected':''}>${d}</option>`).join('')}</select><label>Minutes</label><input id="em2" type="number" value="${r.min}"><label>Description</label><input id="es" value="${e(r.desc)}"><label>Tasks — one per line: question | answer1;answer2</label><textarea id="eq" rows="7">${e(r.qs.map(q=>q.q+'|'+q.a).join('\n'))}</textarea><button class="btn" onclick="sv()">Save</button> <button class="btn g" onclick="edit=null;draw()">Cancel</button></div>`}
h+=`<div class="card scroll" style="margin-top:16px"><table><tr><th>#</th><th>Room</th><th>Level</th><th>Tasks</th><th></th></tr>${S.rooms.map((r,i)=>`<tr><td>${i+1}</td><td>${e(r.title)}</td><td><span class="tag ${r.diff}">${r.diff}</span></td><td>${r.qs.length}</td><td style="white-space:nowrap"><button class="btn g s" onclick="mv(${i},-1)">↑</button> <button class="btn g s" onclick="mv(${i},1)">↓</button> <button class="btn g s" onclick="edt(${i})">Edit</button> <button class="btn g s" onclick="del(${i})">Delete</button></td></tr>`).join('')}</table></div>
<h3 style="margin:28px 0 12px">Student results</h3><div class="card scroll"><table><tr><th>Student</th><th>Email</th><th>Rooms</th><th>Points</th></tr>${st.map(u=>`<tr><td>${e(u.name)}</td><td>${e(u.email)}</td><td>${S.rooms.filter(r=>cleared(u.email,r)).length}/${S.rooms.length}</td><td>${pts(u.email)}</td></tr>`).join('')||'<tr><td colspan=4>No students yet.</td></tr>'}</table></div></main>`;return h}
function edt(i){edit=i;draw()}
function sv(){const qs=$('eq').value.split('\n').filter(l=>l.includes('|')).map(l=>{const[a,...b]=l.split('|');return{q:a.trim(),a:b.join('|').trim()}});if(!$('et').value.trim()||!qs.length)return toast('Title and at least one task needed');
const o={title:$('et').value.trim(),cat:$('ec').value.trim()||'General',diff:$('ed').value,min:+$('em2').value||15,desc:$('es').value.trim(),qs};
if(edit>=0)S.rooms[edit]={...S.rooms[edit],...o};else S.rooms.push({...o,id:Math.max(0,...S.rooms.map(r=>r.id))+1});edit=null;save();draw()}
function mv(i,d){const j=i+d;if(j<0||j>=S.rooms.length)return;[S.rooms[i],S.rooms[j]]=[S.rooms[j],S.rooms[i]];save();draw()}
function del(i){if(confirm('Delete this room?')){S.rooms.splice(i,1);save();draw()}}
function draw(){const h=location.hash.slice(1)||'path',a=$('app');
if(!S.me){a.innerHTML=auth();return}
a.innerHTML=header(h)+(h=='board'?board():h=='admin'?admin():h.startsWith('room-')?room(h.slice(5)):path());window.scrollTo(0,0)}
addEventListener('hashchange',draw);draw();
</script></body></html>
