<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ECST CCNA Challenge Labs - Test Suite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 32px 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #334155;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    .badge-storage {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #38bdf8;
      padding: 6px 12px;
      border-radius: 6px;
      margin-top: 6px;
    }
    .summary-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 700;
    }
    .stat-val.pass { color: #4ade80; }
    .stat-val.fail { color: #f87171; }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .test-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .test-card.pass { border-left: 4px solid #4ade80; }
    .test-card.fail { border-left: 4px solid #f87171; }
    .pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .pill.pass { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .pill.fail { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .test-details {
      flex: 1;
    }
    .test-name {
      font-weight: 600;
      font-size: 15px;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .test-msg {
      font-size: 13px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      word-break: break-all;
    }
  </style>
  <script>
    // CRITICAL: Set temporary test storage key to isolate from production ecst_v4
    window.__ECST_KEY = 'ecst_test';
  </script>
  <!-- Load data dependencies and store -->
  <script src="data/core.js"></script>
  <script src="data/scenarios.js"></script>
  <script src="data/terminal-demo.js"></script>
  <script src="data/dev-demo.js"></script>
  <script src="js/store.js"></script>
  <script>
    // Verify QuestionTypes exists and works immediately after loading only data + store.js
    window.__storeOnlyRegistryWorks = false;
    if (window.QuestionTypes && typeof window.QuestionTypes.register === 'function') {
      const immediateHandler = { render: () => '<div>immediate</div>', check: () => true };
      window.QuestionTypes.register('early-type-check', immediateHandler);
      if (window.QuestionTypes.get('early-type-check') === immediateHandler) {
        window.__storeOnlyRegistryWorks = true;
      }
    }
  </script>
  <script src="js/rooms.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>ECST CCNA Challenge Labs &mdash; Test Runner</h1>
      <div class="badge-storage">
        🔒 Active Storage Key: <strong>ecst_test</strong> &bull; Production key <code>ecst_v4</code> is completely untouched
      </div>
    </header>

    <div class="summary-card">
      <div class="stat">
        <span class="stat-label">Total Tests</span>
        <span class="stat-val" id="stat-total">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Passed</span>
        <span class="stat-val pass" id="stat-passed">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Failed</span>
        <span class="stat-val fail" id="stat-failed">0</span>
      </div>
    </div>

    <div class="test-list" id="test-list"></div>
  </div>

  <script>
    (function runTestSuite() {
      const results = [];
      const testListEl = document.getElementById('test-list');

      // Preserve any existing real storage snapshot just in case
      const backupRealKey = localStorage.getItem('ecst_v4');

      function test(name, fn) {
        try {
          fn();
          results.push({ name, pass: true, msg: 'Assertion passed' });
        } catch (err) {
          results.push({ name, pass: false, msg: err && err.message ? err.message : String(err) });
        }
      }

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message || 'Assertion failed');
        }
      }

      try {
        // --- TEST: QuestionTypes registry exists after loading only data + store.js ---
        test('QuestionTypes registry exists after data + store.js and supports register/get', () => {
          assert(window.__storeOnlyRegistryWorks === true, 'QuestionTypes must register and get immediately after store.js');
          const testX = { render: () => '<div>x</div>', check: () => true };
          QuestionTypes.register('x', testX);
          assert(QuestionTypes.get('x') === testX, "QuestionTypes.get('x') must return the registered handler");
        });

        // --- TEST 1: Unique room IDs across all SEED rooms ---
        test('1. Unique room IDs across SEED rooms', () => {
          const seed = window.SEED || [];
          assert(seed.length > 0, 'SEED must not be empty');
          const ids = seed.map(r => r.id);
          const uniqueIds = new Set(ids);
          assert(uniqueIds.size === ids.length, `Duplicate room IDs found: expected ${ids.length}, unique was ${uniqueIds.size}`);
        });

        // --- TEST 2: Unique question IDs per room across SEED rooms ---
        test('2. Unique question IDs per room across SEED rooms', () => {
          const seed = window.SEED || [];
          seed.forEach(r => {
            const qIds = (r.qs || []).map(q => q.id);
            const unique = new Set(qIds);
            assert(unique.size === qIds.length, `Room ${r.id} (${r.title}) has duplicate question IDs`);
            qIds.forEach(id => assert(id !== undefined && id !== null, `Room ${r.id} has undefined question ID`));
          });
        });

        // --- TEST 3: Every text question has "a" ---
        test('3. Every text question has valid answer "a"', () => {
          const seed = window.SEED || [];
          seed.forEach(r => {
            (r.qs || []).forEach((q, idx) => {
              const type = q.type || 'text';
              if (type === 'text') {
                assert(typeof q.a === 'string' && q.a.trim().length > 0, `Room ${r.id} question ${idx} missing answer string 'a'`);
              }
            });
          });
        });

        // --- TEST 4: Every MCQ question has options and a valid "correct" ---
        test('4. Every MCQ question has options and valid "correct"', () => {
          const seed = window.SEED || [];
          seed.forEach(r => {
            (r.qs || []).forEach((q, idx) => {
              if (q.type === 'mcq') {
                assert(Array.isArray(q.options) && q.options.length >= 2, `Room ${r.id} MCQ question ${idx} must have at least 2 options`);
                assert(typeof q.correct === 'number' && q.correct >= 0 && q.correct < q.options.length, `Room ${r.id} MCQ question ${idx} has invalid correct index: ${q.correct}`);
              }
            });
          });
          // Also validate an explicit MCQ schema assertion
          const sampleMCQ = { type: 'mcq', q: 'Which port is HTTP?', options: ['21', '22', '80', '443'], correct: 2 };
          assert(Array.isArray(sampleMCQ.options) && typeof sampleMCQ.correct === 'number' && sampleMCQ.correct < sampleMCQ.options.length, 'MCQ schema validator check');
        });

        // --- TEST 5: No duplicate question text across rooms ---
        test('5. No duplicate question text across different rooms', () => {
          const seed = window.SEED || [];
          const seen = new Map();
          seed.forEach(r => {
            (r.qs || []).forEach(q => {
              const text = (q.q || '').trim().toLowerCase();
              if (text) {
                if (seen.has(text)) {
                  const prev = seen.get(text);
                  throw new Error(`Duplicate question text across rooms: Room ${prev.roomId} and Room ${r.id} share "${text}"`);
                }
                seen.set(text, { roomId: r.id });
              }
            });
          });
        });

        // --- TEST 6: Merge keeps edited rooms and doesn't resurrect deleted ones ---
        test('6. Merge keeps edited rooms and does not resurrect deleted rooms', () => {
          const testState = {
            users: [{ name: 'Test Admin', email: 'admin@ecst.edu', pass: 'Ecst@2026!', role: 'admin' }],
            prog: {},
            rooms: [
              { id: 1, title: 'Edited Room 1 Title', cat: 'Fundamentals', diff: 'Easy', min: 10, desc: 'Edited', edited: true, qs: [{ id: 0, q: 'Q1', a: 'A1' }] }
            ],
            deleted: [2],
            me: null,
            exams: {}
          };
          localStorage.setItem('ecst_test', JSON.stringify(testState));
          Store.load();
          const loaded = Store.get();

          const room1 = loaded.rooms.find(r => r.id === 1);
          assert(room1 && room1.title === 'Edited Room 1 Title', 'Edited room title must be preserved and not overwritten from SEED');
          assert(room1.edited === true, 'Room 1 must retain edited: true');

          const room2 = loaded.rooms.find(r => r.id === 2);
          assert(!room2, 'Deleted room (id: 2) must not be resurrected from SEED');
          assert(loaded.deleted.includes(2), 'S.deleted must still contain 2');
        });

        // --- TEST 7: Deleting then creating a room never reuses the id ---
        test('7. Deleting then creating a room never reuses the deleted ID', () => {
          // Find max room id
          const maxId = Math.max(...Store.get().rooms.map(r => r.id));
          Store.deleteRoom(maxId);
          assert(Store.get().deleted.includes(maxId), `Room ${maxId} must be in S.deleted`);
          assert(!Store.get().rooms.some(r => r.id === maxId), `Room ${maxId} must be removed from S.rooms`);

          const createdRoom = Store.saveRoom({
            title: 'Test Created Room',
            cat: 'Testing',
            diff: 'Easy',
            min: 15,
            desc: 'New room description',
            qs: [{ q: 'New Question 1', a: 'ans1' }]
          });

          assert(createdRoom.id > maxId, `New room ID must be strictly greater than deleted max ID (${maxId}), got ${createdRoom.id}`);
          assert(createdRoom.id !== maxId, `New room ID must not reuse deleted room ID ${maxId}`);
        });

        // --- TEST 8: Legacy admin migration moves progress and updates S.me ---
        test('8. Legacy admin migration moves S.prog, S.exams, and S.me', () => {
          const oldAdminEmail = 'oldsupervisor@ecst.edu';
          const legacyState = {
            users: [
              { name: 'Old Supervisor', email: oldAdminEmail, pass: 'OldPassword123', role: 'admin' },
              { name: 'Regular Student', email: 'student@ecst.edu', pass: 'p', role: 'student' }
            ],
            prog: {
              [oldAdminEmail]: { 1: [0, 1], 2: [0] }
            },
            exams: {
              [oldAdminEmail]: [{ date: '2026-11-01', correct: 5, total: 5, secs: 120 }]
            },
            rooms: (window.SEED || []).slice(0, 3),
            deleted: [],
            me: oldAdminEmail
          };

          localStorage.setItem('ecst_test', JSON.stringify(legacyState));
          Store.load();
          const s = Store.get();

          const migratedAdmin = s.users.find(u => u.email === 'admin@ecst.edu');
          assert(migratedAdmin, 'Admin user must be renamed to admin@ecst.edu');
          assert(migratedAdmin.pass === 'Ecst@2026!', 'Admin password must be updated to Ecst@2026!');
          assert(!s.users.some(u => u.email === oldAdminEmail), 'Old admin email must not exist in users');

          assert(!s.prog[oldAdminEmail], 'Old admin progress key must be deleted');
          assert(s.prog['admin@ecst.edu'], 'Progress must be moved to admin@ecst.edu');
          assert(JSON.stringify(s.prog['admin@ecst.edu'][1]) === JSON.stringify([0, 1]), 'Room 1 progress must match old progress');

          assert(!s.exams[oldAdminEmail], 'Old admin exams key must be deleted');
          assert(s.exams['admin@ecst.edu'] && s.exams['admin@ecst.edu'].length === 1, 'Exams must be moved to admin@ecst.edu');

          assert(s.me === 'admin@ecst.edu' || (typeof s.me === 'object' && s.me.email === 'admin@ecst.edu'), 'S.me must be updated to admin@ecst.edu');
        });

        // --- TEST 9: Second admin created later is NOT renamed ---
        test('9. Second admin created later is NOT renamed', () => {
          const twoAdminsState = {
            users: [
              { name: 'ECST Admin', email: 'admin@ecst.edu', pass: 'Ecst@2026!', role: 'admin' },
              { name: 'Second Supervisor', email: 'supervisor2@ecst.edu', pass: 'Secret@2026', role: 'admin' }
            ],
            prog: {},
            rooms: (window.SEED || []).slice(0, 2),
            deleted: [],
            me: null,
            exams: {}
          };

          localStorage.setItem('ecst_test', JSON.stringify(twoAdminsState));
          Store.load();
          const s = Store.get();

          assert(s.users.length === 2, 'Must still have 2 users');
          const secondAdmin = s.users.find(u => u.email === 'supervisor2@ecst.edu');
          assert(secondAdmin, 'Second admin email must remain supervisor2@ecst.edu');
          assert(secondAdmin.pass === 'Secret@2026', 'Second admin password must remain unchanged');
        });

        // --- TEST 10: Store.saveRoom question IDs and deduplication ---
        test('10. Store.saveRoom preserves IDs, extra fields, and matches duplicate text at most once', () => {
          const testRoom = {
            id: 99,
            title: 'Q-ID Test Room',
            cat: 'Testing',
            diff: 'Medium',
            min: 20,
            desc: 'Room to test matching',
            qs: [
              { id: 10, q: 'Duplicate Question Text', a: 'ans1', pts: 15, type: 'text', explain: 'Exp 1' },
              { id: 20, q: 'Duplicate Question Text', a: 'ans2', pts: 25, type: 'text', explain: 'Exp 2' },
              { id: 30, q: 'Unique Question Text', a: 'ans3' }
            ]
          };

          Store.get().rooms.push(testRoom);

          // Update room with:
          // 1. One "Duplicate Question Text"
          // 2. Another "Duplicate Question Text"
          // 3. Brand new question text
          const updated = Store.saveRoom({
            id: 99,
            title: 'Q-ID Test Room (Edited)',
            cat: 'Testing',
            diff: 'Medium',
            min: 20,
            desc: 'Room to test matching',
            qs: [
              { q: 'Duplicate Question Text', a: 'ans1-updated' },
              { q: 'Duplicate Question Text', a: 'ans2-updated' },
              { q: 'Brand New Question Text', a: 'ans-new' }
            ]
          });

          assert(updated.qs[0].id === 10, `First matched question should retain id 10, got ${updated.qs[0].id}`);
          assert(updated.qs[0].pts === 15, `Extra field 'pts' should be preserved on first matched question`);
          assert(updated.qs[0].explain === 'Exp 1', `Extra field 'explain' should be preserved`);

          assert(updated.qs[1].id === 20, `Second duplicate question should match second old question and get id 20, got ${updated.qs[1].id}`);
          assert(updated.qs[1].id !== updated.qs[0].id, `Two questions with same text must NOT get the same ID`);

          assert(updated.qs[2].id > 30, `Brand new question must get nextQId from per-room counter (> 30), got ${updated.qs[2].id}`);
        });

        // --- TEST 11: QuestionTypes text norm:ios with window.Norm ---
        test('11. QuestionTypes text with q.norm=ios and window.Norm accepts normalized commands, rejects without norm', () => {
          const originalNorm = window.Norm;
          try {
            window.Norm = { ios: s => s.replace(/^sh /, 'show ') };
            const handler = QuestionTypes.get('text');
            assert(handler && typeof handler.check === 'function', 'text handler must have check function');

            const qIos = { q: 'Show routing table', a: 'show ip route', norm: 'ios' };
            assert(handler.check(qIos, 'sh ip route') === true, "With q.norm='ios', 'sh ip route' must be accepted for 'show ip route'");

            const qPlain = { q: 'Show routing table', a: 'show ip route' };
            assert(handler.check(qPlain, 'sh ip route') === false, "Without q.norm, 'sh ip route' must NOT be accepted for 'show ip route'");
          } finally {
            if (originalNorm !== undefined) {
              window.Norm = originalNorm;
            } else {
              delete window.Norm;
            }
          }
        });

        // --- TEST 12: QuestionTypes text check without window.Norm does not crash ---
        test('12. QuestionTypes text check without window.Norm does not crash', () => {
          const originalNorm = window.Norm;
          try {
            delete window.Norm;
            const handler = QuestionTypes.get('text');
            assert(handler && typeof handler.check === 'function', 'text handler must have check function');

            const qIos = { q: 'Show routing table', a: 'show ip route', norm: 'ios' };
            assert(handler.check(qIos, 'show ip route') === true, 'Exact answer should match normally without window.Norm');
            assert(handler.check(qIos, 'sh ip route') === false, 'Abbreviated input should not match without window.Norm');
          } finally {
            if (originalNorm !== undefined) {
              window.Norm = originalNorm;
            } else {
              delete window.Norm;
            }
          }
        });

        // --- TEST 13: Backup round-trip (exportBackup, resetAll, importBackup) ---
        test('13. Backup round-trip restores users, progress, and rooms; invalid JSON returns ok:false and changes nothing', () => {
          // Setup state with unique user, progress, and room
          const testEmail = 'backup_student@ecst.edu';
          Store.get().users.push({ name: 'Backup Student', email: testEmail, pass: 'Pass123!', role: 'student' });
          Store.markSolved(testEmail, 1, 0);
          const customRoom = {
            id: 888,
            title: 'Backup Custom Room',
            cat: 'BackupCat',
            diff: 'Hard',
            min: 30,
            desc: 'Custom room for backup test',
            qs: [{ id: 0, q: 'Q Backup', a: 'ans-backup' }]
          };
          Store.get().rooms.push(customRoom);
          Store.save();

          // 1. Export backup
          const exported = Store.exportBackup();
          assert(typeof exported === 'string' && exported.length > 0, 'exportBackup must return a non-empty string');

          // 2. Reset all
          Store.resetAll();
          assert(!Store.get().users.some(u => u.email === testEmail), 'After resetAll, test student must be cleared');
          assert(!Store.get().rooms.some(r => r.id === 888), 'After resetAll, custom room 888 must be cleared');
          assert(!Store.get().prog[testEmail], 'After resetAll, test student progress must be cleared');

          // 3. Import backup
          const importResult = Store.importBackup(exported);
          assert(importResult && importResult.ok === true, 'importBackup of valid export must return {ok: true}');

          // Verify users, progress and rooms are restored
          assert(Store.get().users.some(u => u.email === testEmail), 'Restored state must include backup student');
          assert(Store.get().rooms.some(r => r.id === 888), 'Restored state must include custom room 888');
          assert(Store.isSolved(testEmail, 1, 0), 'Restored state must preserve student progress');

          // 4. Invalid JSON import
          const snapshotBeforeInvalid = JSON.stringify(Store.get());
          const invalidResult = Store.importBackup('not json');
          assert(invalidResult && invalidResult.ok === false, "importBackup('not json') must return {ok: false}");
          const snapshotAfterInvalid = JSON.stringify(Store.get());
          assert(snapshotBeforeInvalid === snapshotAfterInvalid, "importBackup('not json') must change nothing");
        });

      } finally {
        // Cleanup test localStorage key
        localStorage.removeItem('ecst_test');

        // Restore real production storage key if it was present
        if (backupRealKey !== null) {
          localStorage.setItem('ecst_v4', backupRealKey);
        }

        // Render test results
        let passedCount = 0;
        let failedCount = 0;

        testListEl.innerHTML = '';
        results.forEach(res => {
          if (res.pass) passedCount++; else failedCount++;
          const card = document.createElement('div');
          card.className = `test-card ${res.pass ? 'pass' : 'fail'}`;
          card.innerHTML = `
            <div class="pill ${res.pass ? 'pass' : 'fail'}">${res.pass ? 'PASS' : 'FAIL'}</div>
            <div class="test-details">
              <div class="test-name">${res.name}</div>
              <div class="test-msg">${res.msg}</div>
            </div>
          `;
          testListEl.appendChild(card);
        });

        document.getElementById('stat-total').textContent = results.length;
        document.getElementById('stat-passed').textContent = passedCount;
        document.getElementById('stat-failed').textContent = failedCount;

        // Print to console for headless / CLI runners
        console.log(`[TESTS FINISHED] Total: ${results.length}, Passed: ${passedCount}, Failed: ${failedCount}`);
        results.forEach(r => {
          console.log(`[${r.pass ? 'PASS' : 'FAIL'}] ${r.name}: ${r.msg}`);
        });
      }
    })();
  </script>
</body>
</html>
